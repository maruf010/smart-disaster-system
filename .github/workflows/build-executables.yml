name: Build Executables for Windows and Mac

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable (.exe)
        run: |
          pyinstaller --name "SDERMS_Windows" --windowed --noconfirm --collect-all customtkinter --add-data "database;database" gui_main.py

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDERMS-Windows-App
          path: dist/SDERMS_Windows/
